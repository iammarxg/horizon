name: Release Horizon Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build production ZIP package
        run: |
          python scripts/package.py

      - name: Extract tag and version
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            VERSION=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
            TAG_NAME="v$VERSION"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Extract Changelog Entry
        id: changelog
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          python -c "
          import re, sys
          tag = sys.argv[1]
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[v|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              notes = match.group(1).strip() if match else f'Release {tag}'
          except Exception:
              notes = f'Release {tag}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n')
          " "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Horizon ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: releases/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

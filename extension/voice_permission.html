<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Permission - Horizon</title>
  <link rel="icon" type="image/png" href="assets/icons/icon48.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #16161a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(28px) saturate(1.8);
      -webkit-backdrop-filter: blur(28px) saturate(1.8);
    }
    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #4285f4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: white;
      box-shadow: 0 4px 20px rgba(66, 133, 244, 0.45);
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 14.5px; color: rgba(255, 255, 255, 0.7); line-height: 1.5; margin-bottom: 24px; }
    .btn {
      background: #4285f4;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .btn:hover { background: #3367d6; box-shadow: 0 2px 8px rgba(66, 133, 244, 0.4); transform: scale(1.02); }
    .status { font-size: 14px; margin-top: 16px; color: #34a853; line-height: 1.4; }
    .error { color: #ea4335; }

    /* Light theme matching Horizon */
    @media (prefers-color-scheme: light) {
      body {
        background: #f1f3f4;
        color: #202124;
      }
      .card {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      }
      p {
        color: #5f6368;
      }
    }
    body.theme-light {
      background: #f1f3f4;
      color: #202124;
    }
    body.theme-light .card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }
    body.theme-light p {
      color: #5f6368;
    }
    body.theme-dark {
      background: #16161a;
      color: #ffffff;
    }
    body.theme-dark .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    body.theme-dark p {
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zm-5 9a7 7 0 0 0 7-7h-2a5 5 0 0 1-10 0H5a7 7 0 0 0 7 7z"/>
      </svg>
    </div>
    <h1>Enable Microphone</h1>
    <p id="desc">To use Voice Search in Horizon, click <strong>Allow</strong> when prompted by Chrome.</p>
    <button class="btn" id="allow-btn">Grant Microphone Access</button>
    <div id="status" class="status" style="display:none;"></div>
  </div>
  <script src="voice_permission.js"></script>
</body>
</html>
